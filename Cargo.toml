[package]
name = "editor-pro"
version = "0.2.10"
edition = "2024"
rust-version = "1.88"
description = "A small terminal-native, Vim-inspired code editor"
repository = "https://github.com/perrness/editor-pro"
publish = false

[[bin]]
name = "editor-pro"
path = "src/main.rs"

[dependencies]
flate2 = "1.1"
fs2 = "0.4"
ignore = "0.4"
lsp-types = "0.95.1"
nucleo = "0.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1", features = ["fs"] }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tar = "0.4"
tokio = { version = "1.48", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
tree-sitter = "0.26.3"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-java = "0.23.5"
tree-sitter-json = "0.24"
tree-sitter-kotlin = { package = "tree-sitter-kotlin-sg", version = "0.4.1" }
tree-sitter-md = { version = "0.5", features = ["parser"] }
tree-sitter-rust = "0.24.0"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
unicode-segmentation = "1.12"
unicode-width = "0.2"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
