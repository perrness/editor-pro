[package]
name = "editor-pro"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small terminal-native, Vim-inspired code editor"
publish = false

[dependencies]
ignore = "0.4"
nucleo = "0.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
tempfile = "3.23"
tree-sitter = "0.25.10"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-java = "0.23.5"
tree-sitter-json = "0.24"
tree-sitter-kotlin = { package = "tree-sitter-kotlin-sg", version = "0.4.1" }
tree-sitter-md = "0.5"
tree-sitter-rust = "0.24.0"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
