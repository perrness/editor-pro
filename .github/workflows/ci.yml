name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use a canonical temporary directory
        # Keep fixture paths canonical; macOS /var aliases /private/var.
        run: echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Install Rust tooling
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked
      - run: python3 -m unittest discover -s tools/kotlin-lsp -p 'test_*.py' -v
      - run: python3 tools/terminal_smoke.py
